name: Legacy RLR smoke check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Install pinned legacy rEDM
        shell: Rscript {0}
        run: |
          install.packages(c('Rcpp','RcppEigen'), repos='https://cloud.r-project.org')
          install.packages('https://cran.r-project.org/src/contrib/Archive/rEDM/rEDM_0.7.3.tar.gz', repos=NULL, type='source')
      - run: Rscript smoke.R
